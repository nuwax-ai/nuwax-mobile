<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; frame-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src wss: https:; media-src blob:">
  <style>
    html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    [hidden] { display: none !important; }
    main { position: relative; display: flex; flex-direction: column; box-sizing: border-box; background: #f2f3f5; color: white; }
    #share { min-height: 0; flex: 1; cursor: pointer; }
    #cameras { width: 100%; min-height: 0; flex: 1; display: grid; gap: 10px; padding: 10px; box-sizing: border-box; }
    .solo #cameras, .focused #cameras, [data-layout="topThumbs"] #cameras,
    [data-layout="sideThumbs"] #cameras, [data-layout="speaker"] #cameras { gap: 0; padding: 0; }
    .shared[data-layout="grid"] #cameras { flex: 0 0 24%; }
    [data-layout="topThumbs"]:not(.fullscreen) { padding-top: 76px; }
    [data-layout="sideThumbs"]:not(.fullscreen) { padding-right: 76px; }
    #thumbs { display: flex; gap: 8px; position: absolute; z-index: 3; padding: 8px 10px; box-sizing: border-box; }
    [data-layout="topThumbs"] #thumbs { inset: 0 0 auto; height: 76px; overflow-x: auto; }
    [data-layout="sideThumbs"] #thumbs { inset: 0 0 0 auto; width: 76px; flex-direction: column; overflow-y: auto; }
    #thumbs button { flex: none; width: 52px; height: 52px; border: 1px solid transparent; border-radius: 10px; background: #e4e8f3; color: #27345d; font: 16px system-ui; }
    #thumbs button[aria-pressed="true"] { border-color: #3370ff; }
    #meeting-pip { position: absolute; top: 8px; right: 8px; z-index: 1; border: 0; padding: 7px 10px; border-radius: 8px; background: #292832d9; color: white; font: 13px system-ui; }
    #meeting-pip[aria-pressed="true"] { background: #3532ce; }
    #capture-actions { position: absolute; z-index: 1; inset: 0; align-content: center; text-align: center; background: #f2f3f5; }
    #capture-actions button { margin: 4px; padding: 10px 16px; border: 0; border-radius: 8px; font: 15px system-ui; color: #272837; }
    #capture-actions #start-capture { background: #292832; color: white; }
    figure { position: relative; margin: 0; width: 100%; min-width: 0; min-height: 0; background: #202827; border-radius: 5px; overflow: hidden; box-sizing: border-box; }
    #cameras > figure { height: auto; }
    #share > figure { height: 100%; border-radius: 0; }
    .solo #cameras > figure, .focused #cameras > figure, [data-layout="topThumbs"] #cameras > figure,
    [data-layout="sideThumbs"] #cameras > figure, [data-layout="speaker"] #cameras > figure { border-radius: 0; }
    video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover !important; }
    video.screen-share { object-fit: contain !important; }
    figcaption { position: absolute; z-index: 1; left: 2px; bottom: 2px; max-width: 90%; padding: 4px 5px; border-radius: 3px; background: #ffffffbf; color: #1f2329; font: 10px system-ui; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
    .member-mic { flex: none; width: 8px; margin-right: 3px; color: #3370ff; }
    .member-mic.off { color: #8f959e; }
    .member-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .member-hand, .member-host, .member-rec { flex: none; margin-left: 4px; }
    .member-host { color: #6254e7; }
    .member-rec { color: #d43b3b; font-weight: 600; }
    .placeholder { display: grid; place-content: center; background: #edf0fa; color: #27345d; font: 30px system-ui; }
  </style>
  <script defer src="room.js"></script>
</head>
<body>
  <main id="stage">
    <section id="share" hidden></section>
    <section id="cameras"></section>
    <section id="thumbs" hidden></section>
    <button id="meeting-pip" type="button" hidden></button>
    <section id="capture-actions" hidden>
      <button id="start-capture" type="button"></button>
      <button id="cancel-capture" type="button"></button>
    </section>
  </main>
</body>
</html>
