<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; frame-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src wss: https:; media-src blob:">
  <style>
    html, body, main { height: 100%; margin: 0; }
    [hidden] { display: none !important; }
    main { position: relative; display: flex; flex-direction: column; box-sizing: border-box; background: #f2f3f5; color: white; }
    #share { min-height: 0; flex: 1; cursor: pointer; }
    #cameras { min-height: 0; flex: 1; display: grid; grid-auto-rows: minmax(0, 1fr); gap: 4px; padding: 4px; }
    .shared[data-layout="grid"] #cameras { flex: 0 0 24%; }
    [data-layout="topThumbs"]:not(.fullscreen) { padding-top: 60px; }
    [data-layout="sideThumbs"]:not(.fullscreen) { padding-right: 60px; }
    #thumbs { display: flex; gap: 8px; position: absolute; padding: 4px; }
    [data-layout="topThumbs"] #thumbs { inset: 0 0 auto; overflow-x: auto; }
    [data-layout="sideThumbs"] #thumbs { inset: 0 0 0 auto; flex-direction: column; overflow-y: auto; }
    #thumbs button { flex: none; width: 50px; height: 50px; border: 1px solid transparent; border-radius: 8px; background: #e4e8f3; color: #27345d; font: 16px system-ui; }
    #thumbs button[aria-pressed="true"] { border-color: #3370ff; }
    #meeting-pip { position: absolute; top: 8px; right: 8px; z-index: 1; border: 0; padding: 7px 10px; border-radius: 8px; background: #292832d9; color: white; font: 13px system-ui; }
    #meeting-pip[aria-pressed="true"] { background: #3532ce; }
    #capture-actions { position: absolute; z-index: 1; inset: 0; align-content: center; text-align: center; background: #f2f3f5; }
    #capture-actions button { margin: 4px; padding: 10px 16px; border: 0; border-radius: 8px; font: 15px system-ui; color: #272837; }
    #capture-actions #start-capture { background: #292832; color: white; }
    figure { position: relative; margin: 0; height: 100%; min-height: 0; background: #202827; border-radius: 12px; overflow: hidden; }
    video { display: block; width: 100%; height: 100%; object-fit: cover; }
    #share video { object-fit: contain; }
    figcaption { position: absolute; inset: auto 0 0; padding: 8px; background: #0008; font: 13px system-ui; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .placeholder { display: grid; place-content: center; background: #edf0fa; color: #27345d; font: 30px system-ui; }
    .placeholder figcaption { color: white; }
  </style>
  <script defer src="room.js"></script>
</head>
<body>
  <main id="stage">
    <section id="share" hidden></section>
    <section id="cameras"></section>
    <section id="thumbs" hidden></section>
    <button id="meeting-pip" type="button" hidden></button>
    <section id="capture-actions" hidden>
      <button id="start-capture" type="button"></button>
      <button id="cancel-capture" type="button"></button>
    </section>
  </main>
</body>
</html>
