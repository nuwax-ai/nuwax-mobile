<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
</head>
<body>
<script>
(function () {
  var search = location.search.charAt(0) === "?" ? location.search.substring(1) : location.search;
  var token = "";
  var next = "";
  var parts = search.length > 0 ? search.split("&") : [];
  for (var i = 0; i < parts.length; i++) {
    var pair = parts[i].split("=");
    var key = decodeURIComponent(pair[0] || "");
    var value = decodeURIComponent(pair.slice(1).join("=") || "");
    if (key === "token") token = value;
    if (key === "next") next = value;
  }
  try {
    if (token) localStorage.setItem("ACCESS_TOKEN", token);
  } catch (e) {}
  if (next.indexOf(location.origin + "/") !== 0 && next !== location.origin) return;
  location.replace(next);
})();
</script>
</body>
</html>
