<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      App Android WebView 以 file:// + origin=null 加载本页时，带 crossorigin 的 font preload
      会被 CORS 拦截且无法命中（日志里大量 KaTeX_*.woff2 blocked）。H5/http 仍可走 CSS @font-face。
      故不再 preload，避免无效请求拖慢首屏并刷屏。
    -->
    <link rel="stylesheet" href="./libs/katex.min.css">
    <title></title>
  </head>
  <body>
    <!-- 多容器并行截图，避免公式串行 html2canvas 导致历史/SSE 逐个冒泡 -->
    <div id="markImgContainer" class="mark-img-container"></div>
    <div id="markImgContainer1" class="mark-img-container"></div>
    <div id="markImgContainer2" class="mark-img-container"></div>
    <div id="markImgContainer3" class="mark-img-container"></div>
    <script type="text/javascript" src="./libs/uni.webview.1.5.5.js"></script>

    <!-- katex + html2canvas 同步加载；mermaid/mhchem 异步，避免拖慢代理就绪（历史公式可早数百 ms～数秒开渲） -->
    <script type="text/javascript" src="./libs/katex.min.js"></script>
    <script type="text/javascript" src="./libs/html2canvas1.4.1.js"></script>
    <script defer src="./libs/mhchem.min.js"></script>
    <script async src="./libs/mermaid.min.js"></script>
		
    <script type="text/javascript">
        let parentIsAppAndroid = false;
        let parentIsWeb = false;
        let setting = null;
        uni.getEnv(envObj=>{
          // 判断是不是 app 且是 android 平台
          parentIsAppAndroid = (envObj.uvue == true && window.navigator.userAgent.indexOf('Android') > -1)
          parentIsWeb = envObj.h5
        })

        // const isInHarmonyWeb = window.arkWeb != undefined

			
        class ProxyWebHandler {
          setting = {}
          _hostReadySent = false
          /** 并行截图上限（每槽位独立 DOM，互不覆盖） */
          katexConcurrency = 4
          katexActive = 0
          katexWaiters = []
          katexSlotBusy = [false, false, false, false]
          fontsReadyPromise = null
          constructor() {
            // window.addEventListener('storage', (e) => {
            //   console.log('storage change', e);
            // });
            // this.mermaidText = `
            //   graph TD
            //     A[员工提交请假申请] --> B{经理审批}
            //     B -->|通过| C[HR备案]
            //     B -->|拒绝| D[通知员工修改]
            //     C --> E[流程结束]
            //     D --> A
            // `;
            // document.addEventListener('DOMContentLoaded', () => {
            //   this.renderMermaid({
            //     mermaidText: this.mermaidText,
            //     uniqueId: 'mermaid' + Date.now() + Math.random().toString(36).substring(2, 15)
            //   });
            // });
						
            // 尽快通知宿主：document 已可交互，或脚本执行时已过 DOMContentLoaded
            this.signalHostReady();
          }

          signalHostReady() {
            if (this._hostReadySent == true) {
              return;
            }
            const send = () => {
              if (this._hostReadySent == true) {
                return;
              }
              this._hostReadySent = true;
              this.postMessage({
                action: 'DOMContentLoaded_callback',
                param: {}
              });
            };
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', send);
            } else {
              // interactive/complete：同步脚本已跑完，立刻就绪（勿再等 async mermaid）
              send();
            }
          }
          setSetting(e) {
            this.setting = e.data;
          }

          async renderMermaid({ mermaidText, requestId }) {
            const mermaidId = 'fixed-mermaid' // 复用一个元素，传固定的 id 值
            let mermaidRenderResult = null;
            try {
              mermaidRenderResult = await mermaid.render(mermaidId, mermaidText)
            } catch (error) {
              this.postMessage({
                action: "renderMermaid_callback_" + requestId,
                param: {
                  imageDataURL: ''
                }
              });
              // console.error('mermaid render error', error);
              return;
            }
            let { svg, bindFunctions } = mermaidRenderResult;
            let imageDataURL = ""
            if (parentIsWeb) {
              // 修改不规范的 svg ，把 svg 中的 <br/> 替换为 <br/>
              svg = svg.replace(/<br>/g, '<br/>')
              // 加个白色背景
              svg = svg.replace(`<style>#fixed-mermaid{font-family:`, `<style>#fixed-mermaid{background-color: #FFFFFF;font-family:`)
              imageDataURL = "data:image/svg+xml;utf8," + encodeURIComponent(svg);
            } else {
              const mermaidShot = await this.html2Base64(svg);
              imageDataURL = mermaidShot != null && mermaidShot.dataUrl != null
                ? mermaidShot.dataUrl
                : '';
            }
            // console.log('imageDataURL', imageDataURL);
            this.postMessage({
              action: "renderMermaid_callback_" + requestId,
              param: {
                imageDataURL
              }
            });
            return { svg, bindFunctions, imageDataURL };
          }

          postMessage({ action, param }) {
            // console.log('web 内部执行了 postMessage', action, param)
            const arg = { action, param }
            // if (isInHarmonyWeb) {
            //   // TODO:解决在鸿蒙端套娃使用 webview 套 webview 时，无法使用 uni.webView.postMessage 的问题
            //   window.parent.postMessage({ data: { arg, name: 'postMessage' }}, '*');
            // } else {
              uni.webView.postMessage({data: arg});
            // }
          }

          onMessage(param) {
            // console.log('web.onMessage收到', param);
            if (!parentIsAppAndroid) {
              try {
                param = JSON.parse(decodeURIComponent(param));
              } catch (error) {
                console.log('error', error,decodeURIComponent(param));
              }
            }
            // console.log('web 内部执行了 onMessage', param);
            const { action } = param;

            // KaTeX：有限并行（多容器），避免串行队列让公式逐个冒泡、反复撑高滚底
            // 须在 typeof this[action] 之前处理：batch 走 runKatexBatch，类上无同名方法
            if (action === 'katexRender') {
              this.runKatexJob(param).catch(error => {
                this.postMessage({
                  action: `${action}_callback_${param.requestId}`,
                  param: {
                    imageDataURL: '',
                    error: error != null && error.message != null ? error.message : 'katex_queue_failed'
                  }
                });
              });
              return;
            }
            // 历史/整段：一次桥接批量渲，宿主可等齐后单次提交 UI
            if (action === 'katexRenderBatch') {
              this.runKatexBatch(param).catch(error => {
                this.postMessage({
                  action: `${action}_callback_${param.requestId}`,
                  param: {
                    results: [],
                    error: error != null && error.message != null ? error.message : 'katex_batch_failed'
                  }
                });
              });
              return;
            }

            if (typeof this[action] !== 'function') {
              console.error('不支持的 e.action', action);
              throw new Error('不支持的 e.action: ' + action);
            }

            try {
              this[action](param);
            } catch (error) {
              this.postMessage({
                action: `${action}_callback_${param.requestId}`,
                param: {
                  imageDataURL: '',
                  error: error.message
                }
              });
              console.log(action + '方法执行失败', error);
            }
          }
          isIOS() {
            return /iPhone|iPad|iPod/i.test(window.navigator.userAgent || '');
          }

          /** iOS 上 fonts.ready / html2canvas 可能永不 settle，必须加超时。 */
          withTimeout(promise, ms, fallback) {
            return new Promise((resolve) => {
              let done = false;
              const finish = (value) => {
                if (done) return;
                done = true;
                resolve(value);
              };
              setTimeout(() => finish(fallback), ms);
              Promise.resolve(promise).then(
                (value) => finish(value),
                () => finish(fallback)
              );
            });
          }

          ensureFontsReady() {
            if (this.fontsReadyPromise == null) {
              // Android file:// 下 KaTeX woff2 常被 CORS 永久失败，fonts.ready 会空等到超时；
              // 拉长等待只会推迟全部截图回调，表现为历史公式页长时间抖动。
              const ua = window.navigator.userAgent || '';
              const isAndroid = /Android/i.test(ua);
              const timeoutMs = isAndroid ? 60 : (this.isIOS() ? 1500 : 800);
              this.fontsReadyPromise = this.withTimeout(
                document.fonts != null ? document.fonts.ready : Promise.resolve(),
                timeoutMs,
                null
              );
            }
            return this.fontsReadyPromise;
          }

          getCaptureContainer(slotIndex) {
            if (slotIndex <= 0) {
              return document.getElementById('markImgContainer');
            }
            return document.getElementById('markImgContainer' + slotIndex);
          }

          acquireKatexSlot() {
            return new Promise((resolve) => {
              const tryAcquire = () => {
                if (this.katexActive >= this.katexConcurrency) {
                  this.katexWaiters.push(tryAcquire);
                  return;
                }
                let slot = -1;
                for (let i = 0; i < this.katexSlotBusy.length; i++) {
                  if (this.katexSlotBusy[i] != true) {
                    slot = i;
                    break;
                  }
                }
                if (slot < 0) {
                  this.katexWaiters.push(tryAcquire);
                  return;
                }
                this.katexSlotBusy[slot] = true;
                this.katexActive += 1;
                resolve(slot);
              };
              tryAcquire();
            });
          }

          releaseKatexSlot(slotIndex) {
            if (slotIndex >= 0 && slotIndex < this.katexSlotBusy.length) {
              this.katexSlotBusy[slotIndex] = false;
            }
            if (this.katexActive > 0) {
              this.katexActive -= 1;
            }
            const next = this.katexWaiters.shift();
            if (typeof next === 'function') {
              next();
            }
          }

          async runKatexJob(param) {
            const slot = await this.acquireKatexSlot();
            try {
              await this.katexRender(param, slot);
            } finally {
              this.releaseKatexSlot(slot);
            }
          }

          /**
           * 批量公式：内部仍走并行槽位，但只 postMessage 一次。
           * items: [{ id, pureMathText, displayMode }]
           */
          async runKatexBatch(param) {
            const requestId = param.requestId;
            const items = param.items != null && Array.isArray(param.items) ? param.items : [];
            const results = new Array(items.length);
            await Promise.all(
              items.map(async (item, index) => {
                const slot = await this.acquireKatexSlot();
                try {
                  results[index] = await this.katexRenderToResult(item, slot);
                } catch (error) {
                  results[index] = {
                    id: item != null && item.id != null ? item.id : '' + index,
                    imageDataURL: '',
                    resultHtml: '',
                    width: null,
                    height: null,
                    error: error != null && error.message != null ? error.message : 'katex_item_failed'
                  };
                } finally {
                  this.releaseKatexSlot(slot);
                }
              })
            );
            this.postMessage({
              action: 'katexRenderBatch_callback_' + requestId,
              param: { results }
            });
          }

          /** 渲染单条公式并返回结果对象（不 postMessage） */
          async katexRenderToResult(item, slotIndex = 0) {
            const id = item != null && item.id != null ? item.id : '';
            let pureMathText = item != null && item.pureMathText != null ? item.pureMathText : '';
            pureMathText = pureMathText.replace(/\\\\/g, '\\');
            const useDisplayMode = item == null || item.displayMode !== false;
            const resultHtml = katex.renderToString(pureMathText, {
              throwOnError: false,
              displayMode: useDisplayMode,
              output: 'html',
              trust: true,
              strict: 'ignore'
            });
            const htmlForCapture = useDisplayMode
              ? resultHtml
              : '<span class="katex-inline-wrap" style="display:inline-block;font-size:16px;line-height:1.25;padding:1px 6px 1px 1px;">' +
                resultHtml +
                '</span>';
            let imageDataURL = '';
            let cssWidth = 0;
            let cssHeight = 0;
            if (!parentIsWeb) {
              const containerEl = this.getCaptureContainer(slotIndex);
              const shot = await this.html2Base64(
                htmlForCapture,
                2,
                true,
                !useDisplayMode,
                containerEl
              );
              imageDataURL = shot != null && shot.dataUrl != null ? shot.dataUrl : '';
              cssWidth = shot != null && shot.width != null ? shot.width : 0;
              cssHeight = shot != null && shot.height != null ? shot.height : 0;
            }
            return {
              id,
              imageDataURL: parentIsWeb ? null : imageDataURL,
              width: cssWidth > 0 ? cssWidth : null,
              height: cssHeight > 0 ? cssHeight : null,
              resultHtml: parentIsWeb ? resultHtml : '',
              error: (!parentIsWeb && (imageDataURL == null || imageDataURL.length < 32))
                ? 'empty_image'
                : ''
            };
          }

          /**
           * @returns {{ dataUrl: string, width: number, height: number }}
           * width/height 为 CSS 逻辑像素（不是 canvas 物理像素），避免 iOS 上行内公式被放大数倍。
           */
          async html2Base64(htmlString, scale = 2, setTheme = false, fitContent = false, containerEl = null) {
            const markImgContainer =
              containerEl != null
                ? containerEl
                : document.getElementById('markImgContainer');
            const empty = { dataUrl: '', width: 0, height: 0 };
            if (markImgContainer == null) {
              return empty;
            }
            // 行内公式：按内容收缩。iOS 对 fit-content 支持不稳，改用 inline-block + width:auto
            if (fitContent) {
              markImgContainer.style.minWidth = '0';
              markImgContainer.style.width = 'auto';
              markImgContainer.style.maxWidth = 'none';
              markImgContainer.style.display = 'inline-block';
              markImgContainer.style.padding = '2px 8px 2px 4px';
              markImgContainer.style.justifyContent = 'flex-start';
              markImgContainer.style.fontSize = '16px';
              markImgContainer.style.lineHeight = '1.25';
              markImgContainer.style.overflow = 'visible';
            } else {
              markImgContainer.style.minWidth = '360px';
              markImgContainer.style.width = 'auto';
              markImgContainer.style.maxWidth = 'none';
              markImgContainer.style.display = 'inline-block';
              markImgContainer.style.padding = '8px 12px';
              markImgContainer.style.justifyContent = 'center';
              markImgContainer.style.fontSize = '';
              markImgContainer.style.lineHeight = '';
              markImgContainer.style.overflow = 'visible';
            }
            markImgContainer.innerHTML = htmlString;
            // 数学公式统一浅色：白底 + 与会话正文一致的 #404040（勿跟随 dark theme，避免黑底白字）
            if (setTheme) {
              markImgContainer.style.color = '#404040';
              markImgContainer.style.backgroundColor = '#ffffff';
            }
            // 字体只等一次，避免每条公式重复卡 1.5s
            await this.ensureFontsReady();
            // 等一帧让 inline-block 完成布局
            await new Promise(resolve => setTimeout(resolve, 0));
            try {
              // 行内优先截 wrap（含左右 padding），避免只截 .katex 时斜体左右被裁
              // 切勿截大容器：会把空白算进宽高，iOS 上标题公式显得巨大
              const wrapNode = markImgContainer.querySelector('.katex-inline-wrap');
              const katexNode = markImgContainer.querySelector('.katex');
              const captureTarget = fitContent
                ? (wrapNode != null ? wrapNode : (katexNode != null ? katexNode : markImgContainer))
                : (katexNode != null ? katexNode : markImgContainer);
              const rect = captureTarget.getBoundingClientRect();
              // scrollWidth 防止长公式被窄 web-view 视口裁切后 rect 偏小
              const cssWidth = Math.max(
                1,
                Math.ceil(Math.max(rect.width, captureTarget.scrollWidth || 0))
              );
              const cssHeight = Math.max(
                1,
                Math.ceil(Math.max(rect.height, captureTarget.scrollHeight || 0))
              );
              // iOS 画布像素上限更严；dpr*3 易超限得到空图或卡住。iOS 固定较低 scale。
              const dpr = window.devicePixelRatio > 0 ? window.devicePixelRatio : 2;
              const renderScale = this.isIOS()
                ? Math.min(2, dpr)
                : dpr * scale;
              const canvas = await this.withTimeout(
                html2canvas(captureTarget, {
                  allowTaint: true,
                  scale: renderScale,
                  imageTimeout: 300,
                  logging: false,
                  foreignObjectRendering: false,
                  removeContainer: true,
                  useCORS: true,
                  backgroundColor: '#ffffff',
                  width: cssWidth,
                  height: cssHeight,
                  windowWidth: Math.max(cssWidth, 1024),
                  windowHeight: Math.max(cssHeight, 256),
                  x: 0,
                  y: 0,
                  scrollX: 0,
                  scrollY: 0
                }),
                8000,
                null
              );
              markImgContainer.innerHTML = '';
              // 恢复块级公式容器默认样式，避免污染后续渲染
              markImgContainer.style.minWidth = '360px';
              markImgContainer.style.width = 'auto';
              markImgContainer.style.maxWidth = 'none';
              markImgContainer.style.display = 'inline-block';
              markImgContainer.style.padding = '8px 12px';
              markImgContainer.style.justifyContent = 'center';
              markImgContainer.style.fontSize = '';
              markImgContainer.style.lineHeight = '';
              markImgContainer.style.overflow = 'visible';
              if (canvas == null) {
                console.log('html2canvas timeout');
                return empty;
              }
              // iOS Safari/WKWebView 不支持 toDataURL('image/webp')，会回退异常或空 data
              let dataUrl = '';
              try {
                dataUrl = canvas.toDataURL('image/png');
              } catch (e) {
                console.log('toDataURL png error', e);
                dataUrl = '';
              }
              if (dataUrl == null || dataUrl.length < 32 || dataUrl === 'data:,') {
                console.log('toDataURL empty, try jpeg');
                try {
                  dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                } catch (e2) {
                  console.log('toDataURL jpeg error', e2);
                  dataUrl = '';
                }
              }
              // 斜体首尾字符防裁切
              const padX = fitContent ? 2 : 0;
              return {
                dataUrl,
                width: cssWidth + padX,
                height: cssHeight
              };
            } catch (error) {
              console.log('html2canvas error', error);
              markImgContainer.innerHTML = '';
              return empty;
            }
          }

          async katexRender({ pureMathText, requestId, displayMode }, slotIndex = 0) {
            try {
              const param = await this.katexRenderToResult(
                { id: '', pureMathText, displayMode },
                slotIndex
              );
              this.postMessage({
                action: "katexRender_callback_" + requestId,
                param
              });
            } catch (error) {
              this.postMessage({
                action: "katexRender_callback_" + requestId,
                param: {
                  imageDataURL: '',
                  resultHtml: '',
                  width: null,
                  height: null,
                  error: error != null && error.message != null ? error.message : 'katexRender_failed'
                }
              });
            }
          }
        }

        // 实例化并挂载到 window，方便外部调用 onMessage 等
        window.proxyWebHandler = new ProxyWebHandler();
        // 兼容原有全局 onMessage 调用方式
        window.onMessage = (...args) => window.proxyWebHandler.onMessage(...args);
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        /* 勿锁死 100% 宽：长公式需超出父级也能完整布局再截图 */
        width: auto;
        min-width: 100%;
        min-height: 100%;
        overflow: visible;
        background: transparent;
      }
      .mark-img-container {
        padding: 8px 12px;
        display: inline-block;
        box-sizing: border-box;
        background-color: #ffffff;
        color: #404040;
        overflow: visible;
        vertical-align: top;
      }
      /* 斜体数学字母右倾，截图时多留右侧空间 */
      .mark-img-container .katex,
      .mark-img-container .katex-html {
        overflow: visible;
        padding-right: 0.35em;
      }
      .mark-img-container .katex-inline-wrap {
        display: inline-block;
        font-size: 16px;
        line-height: 1.25;
        padding: 1px 6px 1px 1px;
      }
    </style>
  </body>
</html>
