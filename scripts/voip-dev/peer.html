<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuwax VoIP 开发对端</title>
<style>body{font:16px system-ui;max-width:820px;margin:32px auto;padding:0 20px;background:#f5f7fb;color:#14213b}button,select{padding:10px;margin:4px;border:1px solid #ccd4e1;border-radius:8px;background:white}button{cursor:pointer}pre{white-space:pre-wrap;background:white;padding:16px;border-radius:12px}#media{position:relative;height:320px;background:#101827;border-radius:16px;overflow:hidden}.remote-video{width:100%;height:100%;object-fit:contain}.local-video{position:absolute;right:12px;top:12px;width:110px}.remote-audio{display:none}</style></head>
<body><h1>VoIP 开发对端</h1><p>仅供本地联调。agent 是媒体替身，不能证明正式智能体能力。</p>
<label>身份 <select id="identity"><option>alice</option><option>bob</option><option>agent</option></select></label><button id="login">登录开发身份</button>
<label><input type="checkbox" id="synthetic">合成测试音频（不测试麦克风）</label>
<div><select id="conversation"><option value="demo-people">alice ↔ bob</option><option value="demo-agent">alice ↔ agent</option></select>
<button id="audio">语音呼叫</button><button id="video">视频呼叫</button><button id="accept">接听</button><button id="reject">拒接</button><button id="end">取消 / 挂断</button><button id="play">允许播放</button></div>
<div><button id="duplicate">重发重复事件</button><button id="stale">注入旧响铃事件</button><button id="disconnectControl">断开控制连接</button></div>
<div id="media"></div><pre id="status">尚未登录</pre><script src="peer.js"></script></body></html>
