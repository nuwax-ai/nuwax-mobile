allowBuilds:
  core-js: false
# pnpm v11 配置（安装类设置存放于 pnpm-workspace.yaml，而非 .npmrc）
#
# mp-html 的 markdown-it 依赖（linkify-it 等）在 pnpm 严格布局下被隔离在 .pnpm 私有目录，
# HBuilderX 小程序/App 的 UTS 编译器解析不到，需要提升到顶层 node_modules。
# dev 分支无需此配置，因为它用 yarn（扁平提升布局）。
publicHoistPattern:
  - argparse
  - entities
  - linkify-it
  - mdurl
  - punycode.js
  - uc.micro
