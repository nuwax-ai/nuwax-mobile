// 仅在内测对照包加载。保留 DCloud 引用的 Cronet Java API，只剔除内置原生引擎。
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        def jniExcludes = project.extensions.getByName('android').packaging.jniLibs.excludes
        jniExcludes.add('**/libcronet.so')
        jniExcludes.add('**/libcronet.*.so')
    }
}
