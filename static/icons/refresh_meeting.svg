<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <!--
    刷新图标（会议页「历史记录」右侧按钮）：缺口圆环 + 单向箭头，色 #6b6a75。
    1) 圆弧 —— 圆心 (10,10)、半径 7.1、笔画 1.8；从 12:00 (10, 2.9) 逆时针绕 270°
       到 3:00 (17.1, 10)，缺口正好落在右上象限。端点按 SVG 圆弧语义 = butt 端帽，
       12:00 那条端帽就是径向切面 x=10、y 2.0→3.8 的竖直线段。
    2) 箭头 —— 实心三角，底边与上面那条切面**同一条竖直轴**，并故意往弧线里压进
       0.8（底边取 x=9.2），吃掉浮点抗锯齿产生的发丝缝；尖朝右指向缺口，即顺时针方向。
    ★几何在这里一次画准，端上只当普通图片渲染（与「新的伙伴」同一套 svg 通道）。
      之前用 border + transform 手拼，箭头与弧线只是「理论相切」，各端对 border-radius
      缺口角度和旋转舍入的处理不同，真机渲染接不上，故弃用。
  -->
  <path d="M10 2.9A7.1 7.1 0 1 0 17.1 10" stroke="#6b6a75" stroke-width="1.8" stroke-linecap="butt" fill="none" />
  <!-- 三角同时给 stroke：既把尖角磨圆一点，也兜住「不支持纯填充路径」的渲染器
       （最坏情况退回成同色的 V 形线稿，仍然接在弧线端帽上） -->
  <path d="M9.2 0.7L14.8 2.9L9.2 5.1Z" fill="#6b6a75" stroke="#6b6a75" stroke-width="0.6" stroke-linejoin="round" />
</svg>
