<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nuwax-katex</title>
  <!-- KaTeX 样式（woff2 字体随 katex.min.css 相对引用 fonts/） -->
  <link rel="stylesheet" href="katex.min.css" />
  <script src="katex.min.js"></script>
  <script src="uni.webview.1.5.5.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      /* 内容高度=公式高度，禁止 web 内部滚动：App 嵌套滚动判断「web 内容不可滚 → 外层 scroll-view 接管」 */
      overflow: hidden;
      /* 关键：声明本内容不处理触摸平移，Android WebView 不会发起内部滚动/拦截手势，
         竖直拖动全部交给外层 scroll-view（否则 web-view 高度小于内容时会吃掉滚动） */
      touch-action: none;
    }
    /* 公式容器宽度=内容自身宽度（max-content）：
       关键——iOS WKWebView 在 web-view 收缩后 viewport 会跟随重新布局，
       若容器是普通 inline-block（shrink-to-fit），会在「收缩后的窄宽」里重排公式 → 上报窄宽 → 锁死挤压。
       max-content 让容器宽度始终等于公式内容宽度，不随 web-view 收缩变化 → 宽度永远精确。 */
    #formula {
      display: inline-block;
      line-height: 1.2;
      /* max-content：容器宽度=公式内容宽度，不随 web-view 收缩重排（iOS 锁死挤压的关键修复）。
         旧 WebView 兼容前缀 */
      width: -webkit-max-content;
      width: max-content;
    }
    /* 与 H5 katex-el 一致：KaTeX 斜体末字右倾，补 0.35em 避免右缘被 web-view 裁掉（显得「被挤压」）；
       同时上报宽度时把该悬垂计入，行内公式不再偏窄 */
    .katex {
      padding-right: 0.35em;
      overflow: visible;
    }
    .nk-block {
      display: flex;
      width: 100%;
      justify-content: center;
    }
    .nk-inline {
      display: inline-block;
      vertical-align: middle;
    }
    /* 抹掉块级公式默认上下 1em 外边距（行距由外层消息统一控制） */
    .katex-display {
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="formula"></div>
  <script>
    (function () {
      var PENDING = null

      function getParam(name) {
        var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'))
        return m && m[1] != null ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
          return c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : '&quot;'
        })
      }

      function post(data) {
        try {
          uni.webView.postMessage({ data: data })
        } catch (e) {
          /* noop */
        }
      }

      // 诊断：确认 KaTeX CSS / 字体 / 公式结构在 App web-view 里是否正常（分数公式渲染不正确的排查）
      function reportDebug() {
        try {
          var cssLoaded = false
          for (var i = 0; i < document.styleSheets.length; i++) {
            var href = document.styleSheets[i].href || ''
            if (href.indexOf('katex') >= 0) {
              cssLoaded = true
              break
            }
          }
          var fontsReady = 'unsupported'
          if (document.fonts && typeof document.fonts.check === 'function') {
            fontsReady = String(document.fonts.check('16px KaTeX_Main'))
          }
          var el = document.getElementById('formula')
          var htmlLen = el ? (el.innerHTML || '').length : 0
          var mfracCount = el ? (el.querySelectorAll('.mfrac').length) : 0
          post({
            type: 'debug',
            cssLoaded: cssLoaded,
            fontsReady: fontsReady,
            htmlLen: htmlLen,
            mfracCount: mfracCount,
            ua: navigator.userAgent.slice(0, 80),
          })
        } catch (e) {
          post({ type: 'debug', err: String(e && e.message ? e.message : e) })
        }
      }
      setTimeout(reportDebug, 600)
      setTimeout(reportDebug, 2500)

      function reportSize() {
        var el = document.getElementById('formula')
        if (!el) return
        // KaTeX 的斜体末字/根号/分数等元素会溢出容器（overflow:visible），
        // getBoundingClientRect 不含溢出 → 上报宽度偏小 → 行内公式被 web-view 挤压裁剪。
        // 用 scrollWidth/scrollHeight（含溢出内容的完整尺寸）取最大值。
        var rect = el.getBoundingClientRect()
        var w = el.scrollWidth > rect.width ? el.scrollWidth : rect.width
        var h = el.scrollHeight > rect.height ? el.scrollHeight : rect.height
        post({ type: 'size', width: Math.round(w), height: Math.round(h) })
      }

      // 字体加载 / 内容重排导致尺寸变化时立即重报（定时兜底之外的最终保障）：
      // KaTeX 字形依赖 woff2，字体晚到会使宽高偏小、web-view 被裁剪、行内公式被挤压。
      // 注意：observe 的是 #formula，自身重排不会触发循环上报（reportSize 只读不写布局）。
      var resizeTarget = document.getElementById('formula')
      if (typeof ResizeObserver !== 'undefined' && resizeTarget != null) {
        new ResizeObserver(function () {
          reportSize()
        }).observe(resizeTarget)
      }
      window.addEventListener('load', reportSize)

      // 尺寸补报：KaTeX 字形依赖 woff2，字体就绪前 getBoundingClientRect 偏小 → web-view 被裁剪。
      // 不依赖 document.fonts.ready（部分 WebView 不支持），用定时多次兜底 + 字体就绪补报。
      function scheduleSizeReports() {
        setTimeout(reportSize, 80)
        setTimeout(reportSize, 300)
        setTimeout(reportSize, 800)
        setTimeout(reportSize, 1600)
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            setTimeout(reportSize, 80)
          })
        }
      }
      // 注意：不要对 touchmove 做 preventDefault——iOS 上会阻止外层 scroll-view 接管滚动；
      // web 内容已 overflow:hidden 不可滚，App 嵌套滚动会自动让外层接管。

      function renderLatex(payload) {
        var el = document.getElementById('formula')
        if (!el) return
        var tex = payload && payload.tex ? String(payload.tex) : ''
        var html = ''
        try {
          html = katex.renderToString(tex, {
            displayMode: !!(payload && payload.displayMode),
            throwOnError: false,
            errorColor: '#cc0000',
            strict: false,
            output: 'html',
          })
        } catch (e) {
          html = '<span class="katex-error" style="color:#cc0000">' + escapeHtml(tex) + '</span>'
        }
        el.innerHTML = html
        // 字号 / 颜色：作用于 .katex 根（内部 em 相对缩放），与 H5 行为一致
        var root = el.querySelector('.katex') || el
        if (payload && payload.fontSize) root.style.fontSize = payload.fontSize + 'px'
        if (payload && payload.color) root.style.color = payload.color
        document.body.className = payload && payload.displayMode ? 'nk-block' : 'nk-inline'
        // 等字体/布局稳定后多次补报尺寸（首帧 + 字体就绪 + 定时兜底）
        setTimeout(reportSize, 16)
        scheduleSizeReports()
      }

      window.nkRender = renderLatex

      document.addEventListener('DOMContentLoaded', function () {
        renderLatex({
          tex: getParam('tex'),
          displayMode: getParam('display') === '1',
          fontSize: getParam('size') || '',
          color: getParam('color') || '',
        })
      })
    })()
  </script>
</body>
</html>
